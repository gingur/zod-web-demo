name: Secret scan
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  scan:
    uses: gingur/devkit/.github/workflows/infisical.secrets.scan.yml@main
    with:
      # RUNNER=local runs the scan on the box, where the Infisical CLI is installed.
      # devkit sends fork PRs to GitHub-hosted regardless (gingur/devkit#207), so
      # only set the variable once that has merged.
      runner: ${{ vars.RUNNER }}
